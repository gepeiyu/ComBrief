name: combrief_remote
version: master
description: ComBrief Remote firmware for HaaS EDU K1
type: solution
tag: application
keywords:
  - haas
  - haas-edu-k1
  - ble
  - combrief
license: MIT
depends:
  - init: master
  - cli: master
  - osal_aos: master
  - ble_host: master
  - sh1106: master
  - littlefs: master
  - gpio: master
  - i2c: master
  - adc: master
  - timer: master
  - haaseduk1: master
supported_boards:
  - haaseduk1: master
solution:
  cpu_id: cpu0
  board_name: haaseduk1
build_config:
  include:
    - .
    - app_state
    - protocol
    - ble_service
    - display
    - input
    - led
    - power
source_file:
  - "maintask.c"
  - "combrief_remote.c"
  - "app_state/*.c"
  - "protocol/*.c"
  - "ble_service/*.c"
  - "display/*.c"
  - "input/*.c"
  - "led/*.c"
  - "power/*.c"
