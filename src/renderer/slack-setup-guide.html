<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Slack setup guide</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 13px;
        line-height: 1.55;
        color: #1d1d1f;
        background: #fff;
        -webkit-font-smoothing: antialiased;
      }
      .toolbar {
        position: sticky;
        top: 0;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 16px;
        border-bottom: 1px solid #e5e5ea;
        background: #f5f5f7;
      }
      .toolbar h1 {
        margin: 0;
        font-size: 14px;
        font-weight: 600;
      }
      .toolbar button {
        padding: 5px 12px;
        font-size: 12px;
        border: 1px solid #c6c6c8;
        border-radius: 6px;
        background: #fff;
        cursor: pointer;
      }
      #content {
        padding: 16px 20px 28px;
        max-width: 640px;
      }
      #content h1 {
        font-size: 20px;
        margin: 0 0 12px;
      }
      #content h2 {
        font-size: 15px;
        margin: 22px 0 8px;
        padding-top: 4px;
        border-top: 1px solid #eee;
      }
      #content h2:first-of-type {
        border-top: none;
        margin-top: 8px;
      }
      #content h3 {
        font-size: 13px;
        margin: 14px 0 6px;
      }
      #content p,
      #content ul,
      #content ol {
        margin: 0 0 10px;
      }
      #content ul,
      #content ol {
        padding-left: 22px;
      }
      #content li {
        margin: 4px 0;
      }
      #content code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
        background: #f0f0f2;
        padding: 1px 5px;
        border-radius: 4px;
      }
      #content pre {
        margin: 8px 0 12px;
        padding: 10px 12px;
        background: #f5f5f7;
        border-radius: 8px;
        overflow-x: auto;
        font-size: 12px;
        line-height: 1.45;
      }
      #content pre code {
        background: none;
        padding: 0;
      }
      #content table {
        width: 100%;
        border-collapse: collapse;
        margin: 8px 0 14px;
        font-size: 12px;
      }
      #content th,
      #content td {
        border: 1px solid #e5e5ea;
        padding: 6px 8px;
        text-align: left;
        vertical-align: top;
      }
      #content th {
        background: #f5f5f7;
      }
      #content a {
        color: #0066cc;
        text-decoration: none;
      }
      #content a:hover {
        text-decoration: underline;
      }
      #content hr {
        border: none;
        border-top: 1px solid #e5e5ea;
        margin: 16px 0;
      }
      .error {
        color: #c62828;
      }
    </style>
  </head>
  <body>
    <div class="toolbar">
      <h1 id="windowTitle">Slack setup guide</h1>
      <button type="button" id="closeBtn" onclick="window.close()">OK</button>
    </div>
    <div id="content"><p>Loading…</p></div>
    <script src="slack-setup-guide.js"></script>
  </body>
</html>
