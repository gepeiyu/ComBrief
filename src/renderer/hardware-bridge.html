<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self';" />
    <title>ComBrief Remote Pairing</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f6f7fb;
        color: #172033;
      }

      main {
        box-sizing: border-box;
        width: 100%;
        padding: 24px;
      }

      h1 {
        margin: 0 0 10px;
        font-size: 20px;
        line-height: 1.2;
      }

      p {
        margin: 0 0 18px;
        color: #556070;
        font-size: 13px;
        line-height: 1.45;
      }

      button {
        width: 100%;
        border: 0;
        border-radius: 12px;
        padding: 12px 14px;
        background: #2563eb;
        color: white;
        font-size: 14px;
        font-weight: 650;
        cursor: pointer;
      }

      button:hover {
        background: #1d4ed8;
      }

      #bridge-status {
        min-height: 18px;
        margin-top: 14px;
        font-size: 12px;
        color: #556070;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background: #101624;
          color: #f7f9fc;
        }

        p,
        #bridge-status {
          color: #b7c0ce;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1 id="bridge-title">Pair ComBrief Remote</h1>
      <p id="bridge-description">Click the button below, then choose your ComBrief Remote in the Bluetooth picker.</p>
      <button id="connect-button" type="button">Connect ComBrief Remote</button>
      <div id="bridge-status" role="status">Waiting for your click to start Bluetooth pairing.</div>
    </main>
    <script src="hardware-bridge.js"></script>
  </body>
</html>
