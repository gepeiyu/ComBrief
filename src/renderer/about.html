<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>About</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 28px 32px 24px;
        min-width: 440px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 13px;
        color: #1d1d1f;
        background: #f5f5f7;
        -webkit-font-smoothing: antialiased;
      }
      h1 {
        margin: 0 0 6px;
        font-size: 20px;
        font-weight: 600;
      }
      .version {
        margin: 0 0 14px;
        color: #6e6e73;
      }
      .desc {
        margin: 0 0 16px;
        line-height: 1.5;
        color: #3a3a3c;
      }
      a.repo {
        display: inline-block;
        white-space: nowrap;
        color: #0066cc;
        text-decoration: none;
        font-size: 13px;
      }
      a.repo:hover {
        text-decoration: underline;
      }
      .actions {
        margin-top: 22px;
        text-align: center;
      }
      button {
        min-width: 72px;
        padding: 6px 20px;
        font-size: 13px;
        border: 1px solid #c6c6c8;
        border-radius: 6px;
        background: linear-gradient(#fff, #f0f0f2);
        cursor: pointer;
      }
      button:hover {
        background: linear-gradient(#fafafa, #e8e8ea);
      }
    </style>
  </head>
  <body>
    <h1>ComBrief</h1>
    <p class="version" id="version"></p>
    <p class="desc" id="desc"></p>
    <a
      class="repo"
      id="repo"
      href="https://github.com/gepeiyu/ComBrief"
      target="_blank"
      rel="noopener"
      >https://github.com/gepeiyu/ComBrief</a
    >
    <div class="actions">
      <button type="button" id="ok"></button>
    </div>
    <script>
      const params = new URLSearchParams(location.search);
      const versionEl = document.getElementById('version');
      const okBtn = document.getElementById('ok');
      okBtn.onclick = () => window.close();

      async function init() {
        const m = window.combrief
          ? await window.combrief.getMessages()
          : null;
        if (m) {
          document.documentElement.lang =
            m.about.windowTitle === '关于'
              ? 'zh-CN'
              : m.about.windowTitle.includes('について')
                ? 'ja'
                : 'en';
          document.title = m.about.windowTitle;
          document.getElementById('desc').textContent = m.about.description;
          okBtn.textContent = m.about.ok;
          versionEl.textContent =
            m.about.versionPrefix +
            ' ' +
            (params.get('v') || '—');
        } else {
          versionEl.textContent = 'Version ' + (params.get('v') || '—');
          document.getElementById('desc').textContent =
            'Menu bar status lights for Cursor, Claude Code, and other AI tools.';
          okBtn.textContent = 'OK';
        }
      }
      void init();
    </script>
  </body>
</html>
