<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>ComBrief Settings</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        margin: 20px;
        color: #222;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 8px;
      }
      .hint {
        color: #666;
        font-size: 13px;
        margin: 0 0 16px;
        line-height: 1.5;
      }
      .app {
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 12px;
        margin-bottom: 10px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      button {
        cursor: pointer;
        border-radius: 6px;
        border: 1px solid #ccc;
        padding: 6px 10px;
        background: #f7f7f7;
      }
      button.primary {
        background: #1976d2;
        color: #fff;
        border-color: #1976d2;
      }
      label {
        display: block;
        margin: 8px 0;
      }
      .error {
        color: #c62828;
        font-size: 13px;
        margin: 0 0 12px;
      }
      .abbrevs {
        margin: 8px 0 12px 20px;
        font-size: 13px;
      }
      .abbrev-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 6px 0;
      }
      .abbrev-row input {
        width: 48px;
        padding: 4px 6px;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 13px;
        text-align: center;
      }
      select#locale {
        margin-left: 8px;
        padding: 4px 8px;
        border-radius: 4px;
        border: 1px solid #ccc;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <h1>ComBrief</h1>
    <p id="hint" class="hint"></p>
    <p id="error" class="error" hidden></p>
    <div id="apps"></div>
    <hr />
    <label id="label-language"
      ><span id="text-language"></span>
      <select id="locale">
        <option value="en">English</option>
        <option value="zh">中文</option>
        <option value="ja">日本語</option>
      </select></label
    >
    <label
      ><input type="checkbox" id="notifications" />
      <span id="text-notifications"></span
    ></label>
    <label
      ><input type="checkbox" id="launchAtLogin" />
      <span id="text-launchAtLogin"></span
    ></label>
    <label
      ><input type="checkbox" id="showTrayAbbrev" />
      <span id="text-showTrayAbbrev"></span
    ></label>
    <label
      ><input type="checkbox" id="eventLogging" />
      <span id="text-eventLogging"></span
    ></label>
    <div id="abbrevs" class="abbrevs"></div>
    <script src="settings.js"></script>
  </body>
</html>
