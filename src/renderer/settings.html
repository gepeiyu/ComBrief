<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>ComBrief 设置</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        margin: 20px;
        color: #222;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 8px;
      }
      .hint {
        color: #666;
        font-size: 13px;
        margin: 0 0 16px;
        line-height: 1.5;
      }
      .app {
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 12px;
        margin-bottom: 10px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      button {
        cursor: pointer;
        border-radius: 6px;
        border: 1px solid #ccc;
        padding: 6px 10px;
        background: #f7f7f7;
      }
      button.primary {
        background: #1976d2;
        color: #fff;
        border-color: #1976d2;
      }
      label {
        display: block;
        margin: 8px 0;
      }
      .error {
        color: #c62828;
        font-size: 13px;
        margin: 0 0 12px;
      }
      .abbrevs {
        margin: 8px 0 12px 20px;
        font-size: 13px;
      }
      .abbrev-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 6px 0;
      }
      .abbrev-row input {
        width: 48px;
        padding: 4px 6px;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 13px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <h1>ComBrief</h1>
    <p class="hint">
      添加 App 后，<strong>菜单栏</strong>会出现对应状态灯（灰/绿/黄/红圆点）。未添加时仅显示一个灰色圆点。
    </p>
    <p id="error" class="error" hidden></p>
    <div id="apps"></div>
    <hr />
    <label
      ><input type="checkbox" id="notifications" /> 红灯时系统通知</label
    >
    <label
      ><input type="checkbox" id="launchAtLogin" /> 开机自启</label
    >
    <label
      ><input type="checkbox" id="showTrayAbbrev" /> 圆点内显示缩写</label
    >
    <label
      ><input type="checkbox" id="eventLogging" /> 写入调试日志（~/.combrief/logs）</label
    >
    <div id="abbrevs" class="abbrevs"></div>
    <script src="settings.js"></script>
  </body>
</html>
